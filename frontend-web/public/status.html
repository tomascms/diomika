<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Estado dos serviços — Diomika</title>
  <style>
    :root { color-scheme: dark; --bg:#0f1419; --card:#1a2332; --ok:#3dd68c; --bad:#f87171; --muted:#94a3b8; --text:#e2e8f0; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    main { max-width: 720px; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
    .sub { color: var(--muted); margin-bottom: 1.5rem; }
    .grid { display: grid; gap: .75rem; }
    .card { background: var(--card); border: 1px solid #243044; border-radius: 10px; padding: 1rem 1.1rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .name { font-weight: 600; }
    .detail { color: var(--muted); font-size: .9rem; margin-top: .2rem; }
    .pill { font-size: .8rem; font-weight: 700; padding: .25rem .55rem; border-radius: 999px; text-transform: uppercase; letter-spacing: .04em; }
    .pill.ok { background: rgba(61,214,140,.15); color: var(--ok); }
    .pill.bad { background: rgba(248,113,113,.15); color: var(--bad); }
    .pill.wait { background: rgba(148,163,184,.15); color: var(--muted); }
    footer { margin-top: 2rem; color: var(--muted); font-size: .85rem; }
    a { color: #7dd3fc; }
  </style>
</head>
<body>
  <main>
    <h1>Estado dos serviços</h1>
    <p class="sub">Actualização automática a cada 60 segundos.</p>
    <div class="grid" id="checks"></div>
    <footer>
      Loja: <a href="https://www.diomika.com/">www.diomika.com</a> ·
      API: <a href="https://api.diomika.com/health">api.diomika.com</a> ·
      <a href="/.well-known/security.txt">security.txt</a>
    </footer>
  </main>
  <script>
    const TARGETS = [
      { id: 'api', name: 'API Diomika', url: 'https://api.diomika.com/health', ok: (r, t) => r.ok && /online|ready/.test(t) },
      { id: 'api-ready', name: 'API + base de dados', url: 'https://api.diomika.com/health/ready', ok: (r) => r.ok },
      { id: 'site', name: 'Loja online', url: 'https://www.diomika.com/', ok: (r) => r.ok },
    ]

    function pill(state, label) {
      return `<span class="pill ${state}">${label}</span>`
    }

    async function probe(target) {
      const t0 = performance.now()
      try {
        const r = await fetch(target.url, { cache: 'no-store', mode: 'cors' })
        const text = await r.text()
        const ms = Math.round(performance.now() - t0)
        const good = target.ok(r, text)
        return { good, ms, detail: good ? `${ms} ms` : `HTTP ${r.status}` }
      } catch (e) {
        return { good: false, ms: null, detail: 'Indisponível' }
      }
    }

    async function render() {
      const root = document.getElementById('checks')
      root.innerHTML = TARGETS.map(t => `
        <div class="card" id="card-${t.id}">
          <div><div class="name">${t.name}</div><div class="detail">A verificar…</div></div>
          ${pill('wait', '…')}
        </div>`).join('')

      for (const target of TARGETS) {
        const result = await probe(target)
        const card = document.getElementById(`card-${target.id}`)
        card.querySelector('.detail').textContent = result.detail
        card.querySelector('.pill').outerHTML = pill(result.good ? 'ok' : 'bad', result.good ? 'Operacional' : 'Problema')
      }
    }

    render()
    setInterval(render, 60000)
  </script>
</body>
</html>
