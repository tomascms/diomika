groups:
  - name: diomika-api
    interval: 30s
    rules:
      # HTTP errors
      - alert: HighErrorRate
        expr: |
          rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: High error rate detected
          description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.path }}"

      - alert: High4XXRate
        expr: |
          rate(http_requests_total{status=~"4.."}[5m]) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: High 4XX rate
          description: "4XX rate is {{ $value | humanizePercentage }} for {{ $labels.path }}"

      # Latency
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High API latency
          description: "P95 latency is {{ $value }}s for {{ $labels.path }}"

      - alert: VeryHighLatency
        expr: |
          histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Very high API latency
          description: "P99 latency is {{ $value }}s"

      # Database
      - alert: DatabaseConnectionPoolExhausted
        expr: |
          db_connections_available <= 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Database connection pool exhausted
          description: "Only {{ $value }} connections available"

      - alert: DatabaseSlowQueries
        expr: |
          rate(db_query_duration_seconds_bucket{le="+Inf"}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High rate of slow database queries
          description: "{{ $value }} slow queries per second"

      # Cache
      - alert: CacheHitRateLow
        expr: |
          rate(cache_hits_total[5m]) / (rate(cache_hits_total[5m]) + rate(cache_misses_total[5m])) < 0.6
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Cache hit rate is low
          description: "Hit rate is {{ $value | humanizePercentage }}"

      # Memory
      - alert: HighMemoryUsage
        expr: |
          process_resident_memory_bytes / (1024 * 1024 * 1024) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High memory usage
          description: "Memory usage is {{ $value }}GB"

      # CQRS/Events
      - alert: EventProcessingBacklog
        expr: |
          events_queue_size > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Event queue backlog building up
          description: "Queue size is {{ $value }} events"

      - alert: SagaCompensationFailure
        expr: |
          rate(saga_compensation_failures_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Saga compensation failures detected
          description: "{{ $value }} compensation failures per second"

      # Orders
      - alert: OrderInventoryReservationFailure
        expr: |
          rate(order_inventory_reservation_failures_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High order inventory reservation failure rate
          description: "{{ $value | humanizePercentage }} failure rate"

      - alert: OrderSagaTimeout
        expr: |
          rate(order_saga_timeouts_total[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Order saga timeouts occurring
          description: "{{ $value }} timeouts per second"

      # Rate limiting
      - alert: HighRateLimitedRequests
        expr: |
          rate(rate_limit_exceeded_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High rate limiting activity
          description: "{{ $value | humanizePercentage }} requests rate-limited"

      # Audit
      - alert: SuspiciousAuditActivity
        expr: |
          rate(audit_events_total{action=~"DELETE|HARD_DELETE"}[1h]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Suspicious audit activity detected
          description: "{{ $value }} delete operations per hour"

      # SLA
      - alert: APISLAViolation
        expr: |
          (rate(http_requests_total{status=~"5.."}[5m]) > 0.001) or
          (histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: API SLA violation
          description: "Error rate or latency exceeded SLA threshold"
