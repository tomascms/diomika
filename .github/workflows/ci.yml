name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install -r requirements.txt pip-audit
      - name: pip-audit
        run: pip-audit -r requirements.txt
      - name: Security gate (institutional)
        env:
          PYTHONPATH: backend-api
          API_SECRET_KEY: test-key-with-enough-length-32ch
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_KEY: test-service-key
          TURNSTILE_SECRET_KEY: test-turnstile
        run: python deploy/security_gate.py
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  test:
    runs-on: ubuntu-latest
    needs: security-gate
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "20"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Pytest
        env:
          PYTHONPATH: backend-api
          API_SECRET_KEY: test-key-with-enough-length-32ch
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_KEY: test-service-key
          TURNSTILE_SECRET_KEY: test-turnstile
        run: python -m pytest backend-api/tests -q

      - name: RLS verify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_ANON_KEY" ]; then
            python deploy/verify_rls.py
          else
            echo "Skip RLS verify — secrets em falta"
          fi

      - name: Build frontend
        working-directory: frontend-web
        env:
          VITE_API_BASE_URL: https://api.example.com
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
          VITE_SUPABASE_STORAGE_BUCKET: product-images
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm run build
          test ! -f dist/assets/*.map

      - name: Bundle secrets scan
        run: python deploy/verify_bundle_secrets.py
