name: CI Full Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend-api

jobs:
  security-scan:
    name: Security Scanning (9 Tools)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

      - name: Run TruffleHog (secrets detection)
        run: |
          pip install truffleHog
          trufflehog git file://. --json > trufflehog-results.json || true

      - name: Upload TruffleHog results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: trufflehog-results
          path: trufflehog-results.json

  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install flake8 black isort mypy pylint

      - name: Run Black formatter check
        run: black --check backend-api/

      - name: Run isort import check
        run: isort --check-only backend-api/

      - name: Run Flake8 linting
        run: flake8 backend-api/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run MyPy type checking
        run: mypy backend-api/ --ignore-missing-imports || true

      - name: Run Pylint analysis
        run: pylint backend-api/ --disable=all --enable=E,F || true

  unit-tests:
    name: Unit Tests with Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: diomika_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run unit tests with coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/diomika_test
        run: |
          pytest tests/ \
            -v \
            --cov=backend-api \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            -m "not e2e and not slow"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: htmlcov/

  e2e-tests:
    name: E2E Tests with Playwright
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: diomika_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pytest pytest-asyncio

      - name: Start API server
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/diomika_test
          ENVIRONMENT: test
        run: |
          python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Run E2E tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/diomika_test
          API_URL: http://localhost:8000
        run: |
          pytest e2e/ \
            -v \
            -m "e2e" \
            --tb=short

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-test-results
          path: e2e/results/

  load-test-baseline:
    name: Load Testing Baseline (k6)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up k6
        run: |
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3232A
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Set up Python for mock API
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Start mock API server
        run: |
          python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 3

      - name: Run k6 load test (order API)
        run: |
          k6 run load-tests/order-api.js \
            --out json=load-test-results.json \
            --summary-export=load-test-summary.json

      - name: Run k6 load test (payment saga)
        run: |
          k6 run load-tests/payment-saga.js \
            --out json=load-test-payment.json \
            --summary-export=load-test-payment-summary.json

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: load-test-results
          path: |
            load-test-results.json
            load-test-summary.json
            load-test-payment.json
            load-test-payment-summary.json

      - name: Parse and comment load test results
        if: always()
        run: |
          python << 'EOF'
          import json

          with open('load-test-summary.json') as f:
              data = json.load(f)

          print("📊 Load Test Results (Order API)")
          print(f"- Total Requests: {data['metrics'].get('http_reqs', {}).get('value', 'N/A')}")
          print(f"- Success Rate: {data['metrics'].get('http_req_duration', {}).get('value', 'N/A')}ms avg")
          EOF

  security-analysis:
    name: SAST & Bandit Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit security analysis
        run: |
          bandit -r backend-api/ -f json -o bandit-results.json || true

      - name: Run Safety dependency check
        run: |
          safety check --json > safety-results.json || true

      - name: Upload security analysis results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: security-analysis
          path: |
            bandit-results.json
            safety-results.json

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality, unit-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deployment-readiness:
    name: Deployment Readiness Check
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Verify deployment checklist
        run: |
          python << 'EOF'
          import os
          import json

          required_env_vars = [
              "DATABASE_URL",
              "SLACK_WEBHOOK_URL",
              "PAGERDUTY_SERVICE_KEY",
              "AWS_ACCESS_KEY_ID",
              "AWS_SECRET_ACCESS_KEY",
              "GITGUARDIAN_API_KEY",
          ]

          missing = [v for v in required_env_vars if not os.getenv(v)]

          if missing:
              print(f"⚠️  Missing environment variables for deployment: {', '.join(missing)}")
              print("Please set these in GitHub Actions secrets.")
          else:
              print("✅ All required environment variables configured.")
          EOF

      - name: Check Helm chart validity
        run: |
          pip install pyyaml
          python << 'EOF'
          import yaml

          charts = ["helm/Chart.yaml", "helm/values.yaml", "helm/values-production.yaml"]
          for chart in charts:
              try:
                  with open(chart) as f:
                      yaml.safe_load(f)
                  print(f"✅ {chart} is valid")
              except Exception as e:
                  print(f"❌ {chart} is invalid: {e}")
          EOF

  results-summary:
    name: Test Results Summary
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality, unit-tests, e2e-tests, security-analysis]
    if: always()
    steps:
      - name: Create test summary
        run: |
          echo "## 📊 CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Analysis | ${{ needs.security-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
