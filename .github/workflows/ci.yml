name: CI/CD Pipeline

# Cada passo falha a sério: antes estava tudo com `|| true`, incluindo os
# testes, por isso o CI nunca podia ficar vermelho.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api

jobs:
  backend:
    name: API — testes e segurança
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Dependências
        run: pip install -r requirements-dev.txt

      - name: Bandit (severidade e confiança altas)
        run: bandit -q -r backend-api -lll -iii -x backend-api/tests

      - name: Testes
        working-directory: backend-api
        # tests/conftest.py isola tudo (BD, Supabase, Redis, Sentry, email).
        run: pytest tests -q -p no:cacheprovider -o addopts=""

  storefront:
    name: Loja — lint e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Lint
        run: |
          npx oxlint src functions
          npx eslint src functions

      - name: Build de produção
        env:
          VITE_API_BASE_URL: https://api.diomika.com
          VITE_IMAGE_TRANSFORM: "0"
        run: npm run build

      - name: Sem secrets no bundle e CSP correcta
        working-directory: .
        run: |
          python deploy/verify_bundle_secrets.py
          python deploy/verify_csp.py

  backoffice:
    name: Backoffice — build da interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backoffice-desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backoffice-desktop/package-lock.json

      - run: npm ci --ignore-scripts

      - name: Build
        run: npx vite build

      - name: Sintaxe do processo principal (Electron)
        run: |
          node --check electron/main.cjs
          node --check electron/updater.cjs

  vulnerabilities:
    name: Vulnerabilidades críticas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Trivy (dependências do repositório)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  docker:
    name: Imagem Docker da API
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login no registo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (e push na main)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
