name: Uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Monitor API + loja (+ alerta ntfy)
        env:
          API_HEALTH_URL: ${{ secrets.API_HEALTH_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          API="${API_HEALTH_URL:-https://api.diomika.com}"
          SITE="${SITE_URL:-https://www.diomika.com}"
          pip install certifi
          python deploy/monitor_check.py --api "$API" --site "$SITE" --ready --alert
