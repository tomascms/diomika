# Default values for diomika-api
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 3

image:
  repository: diomika/api
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: api.diomika.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: api-diomika-tls
      hosts:
        - api.diomika.com

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /health/live
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health/startup
    port: 8000
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 12

env:
  - name: DIOMIKA_ENV
    value: "production"
  - name: LOG_FORMAT
    value: "json"
  - name: DIOMIKA_API_PORT
    value: "8000"

envFrom:
  - configMapRef:
      name: diomika-api-config
  - secretRef:
      name: diomika-api-secrets

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: logs
    mountPath: /var/log/diomika

volumes:
  - name: tmp
    emptyDir: {}
  - name: logs
    emptyDir: {}

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - diomika-api
          topologyKey: kubernetes.io/hostname

# Database configuration
database:
  host: "postgres.default.svc.cluster.local"
  port: 5432
  name: "diomika"
  ssl: true

# Redis configuration
redis:
  host: "redis.default.svc.cluster.local"
  port: 6379
  db: 0

# Monitoring
monitoring:
  enabled: true
  prometheus:
    enabled: true
    port: 9090

# Logging
logging:
  level: INFO
  format: json

# Security
security:
  apiKeyRequired: true
  corsEnabled: true
  rateLimitingEnabled: true
