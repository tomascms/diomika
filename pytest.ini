[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directory structure
testpaths = tests e2e

# Minimum version
minversion = 7.0

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (database, external services)
    e2e: End-to-end tests (full workflow)
    order_flow: Order creation and fulfillment tests
    payment_flow: Payment processing tests
    invoice_generation: Invoice generation tests
    notification: Email and Slack notification tests
    slow: Slow running tests (use -m "not slow" to skip)
    security: Security scanning tests
    audit: Audit trail and retention tests
    load: Load testing markers

# Async support
asyncio_mode = auto

# Coverage options
[coverage:run]
source = backend-api
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */virtualenv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
