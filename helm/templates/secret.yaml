apiVersion: v1
kind: Secret
metadata:
  name: {{ include "diomika.fullname" . }}
  labels:
    {{- include "diomika.labels" . | nindent 4 }}
type: Opaque
data:
  # Database password (base64 encoded - must be provided)
  {{- if .Values.secrets.databasePassword }}
  database-password: {{ .Values.secrets.databasePassword | b64enc | quote }}
  {{- else }}
  database-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}

  # Redis password
  {{- if .Values.secrets.redisPassword }}
  redis-password: {{ .Values.secrets.redisPassword | b64enc | quote }}
  {{- else }}
  redis-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}

  # JWT Secret
  {{- if .Values.secrets.jwtSecret }}
  jwt-secret: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  {{- else }}
  jwt-secret: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}

  # Slack Webhook URL
  {{- if .Values.secrets.slackWebhookUrl }}
  slack-webhook-url: {{ .Values.secrets.slackWebhookUrl | b64enc | quote }}
  {{- else }}
  slack-webhook-url: {{ "https://hooks.slack.com/services/PLACEHOLDER" | b64enc | quote }}
  {{- end }}

  # PagerDuty Service Key
  {{- if .Values.secrets.pagerdutyServiceKey }}
  pagerduty-service-key: {{ .Values.secrets.pagerdutyServiceKey | b64enc | quote }}
  {{- else }}
  pagerduty-service-key: {{ "placeholder-key" | b64enc | quote }}
  {{- end }}

  # SMTP Password
  {{- if .Values.secrets.smtpPassword }}
  smtp-password: {{ .Values.secrets.smtpPassword | b64enc | quote }}
  {{- else }}
  smtp-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}

  # AWS Credentials
  {{- if .Values.secrets.awsAccessKeyId }}
  aws-access-key-id: {{ .Values.secrets.awsAccessKeyId | b64enc | quote }}
  {{- else }}
  aws-access-key-id: {{ "PLACEHOLDER" | b64enc | quote }}
  {{- end }}

  {{- if .Values.secrets.awsSecretAccessKey }}
  aws-secret-access-key: {{ .Values.secrets.awsSecretAccessKey | b64enc | quote }}
  {{- else }}
  aws-secret-access-key: {{ "PLACEHOLDER" | b64enc | quote }}
  {{- end }}

  # Email addresses
  {{- if .Values.secrets.dbaEmail }}
  dba-email: {{ .Values.secrets.dbaEmail | b64enc | quote }}
  {{- else }}
  dba-email: {{ "dba@diomika.com" | b64enc | quote }}
  {{- end }}

  {{- if .Values.secrets.securityEmail }}
  security-email: {{ .Values.secrets.securityEmail | b64enc | quote }}
  {{- else }}
  security-email: {{ "security@diomika.com" | b64enc | quote }}
  {{- end }}

  {{- if .Values.secrets.salesEmail }}
  sales-email: {{ .Values.secrets.salesEmail | b64enc | quote }}
  {{- else }}
  sales-email: {{ "sales@diomika.com" | b64enc | quote }}
  {{- end }}
