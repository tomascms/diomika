<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Diomika — Manutenção</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(160deg, #1a1714 0%, #2c241c 50%, #1f1b17 100%);
      color: #f3ebe2;
    }
    main { width: min(34rem, 92vw); text-align: center; padding: 2rem; }
    h1 { font-size: clamp(2rem, 5vw, 2.8rem); margin: 0 0 0.75rem; letter-spacing: 0.04em; }
    p { margin: 0; opacity: 0.78; line-height: 1.5; font-family: system-ui, sans-serif; font-size: 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>Diomika</h1>
    <p>Estamos a actualizar a loja. Voltamos dentro de momentos.</p>
  </main>
</body>
</html>
