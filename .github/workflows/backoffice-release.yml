name: Backoffice release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backoffice-desktop/**"
      - ".github/workflows/backoffice-release.yml"
    tags:
      - "backoffice-v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
          - os: macos-latest
            dist: dist:mac
          - os: ubuntu-latest
            dist: dist:linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backoffice-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backoffice-desktop/package-lock.json

      - name: Install
        run: npm ci

      - name: Build installer
        run: npm run ${{ matrix.dist }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          DIOMIKA_DESKTOP_GATE: ${{ secrets.DIOMIKA_DESKTOP_GATE }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diomika-backoffice-${{ matrix.os }}
          path: |
            backoffice-desktop/release/*.exe
            backoffice-desktop/release/*.dmg
            backoffice-desktop/release/*.AppImage
          if-no-files-found: error
          retention-days: 90
