name: Security Scanning

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 0'  # Weekly scan on Sunday at 2 AM

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  sca:
    name: Software Composition Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: jeremylong/DependencyCheck_Action@main
        with:
          project: 'Diomika'
          path: '.'
          format: 'SARIF'
          args: >
            --enableExperimental
            --enable-retired

      - name: Upload Dependency Check results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'dependency-check-report.sarif'
          category: 'dependency-check'

  dast:
    name: Dynamic Application Security Testing
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diomika_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend-api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      - name: Run unit and integration tests
        working-directory: backend-api
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: diomika_test
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          pytest tests/ -v --cov=core --cov=routes --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./backend-api/coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Start application for DAST
        working-directory: backend-api
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: diomika_test
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          DEBUG: "false"
        run: |
          python -m uvicorn core.main:app --host 0.0.0.0 --port 8000 > app.log 2>&1 &
          sleep 10
          curl -f http://localhost:8000/health/live || (cat app.log && exit 1)

      - name: Run OWASP ZAP scan
        uses: zaproxy/action-full-scan@v0.7.0
        with:
          target: 'http://localhost:8000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: false

      - name: Upload ZAP results
        if: always()
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'report_md.sarif'
          category: 'zaproxy'

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --json

      - name: Run GitGuardian scan
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: |
          pip install gitguardian-shield
          ggshield secret scan repo . --json --output ggshield-results.json || true
          cat ggshield-results.json

  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Run Bandit security linter
        working-directory: backend-api
        run: |
          pip install bandit
          bandit -r . -f json -o bandit-report.json || true
          cat bandit-report.json

      - name: Run Pylint security checks
        working-directory: backend-api
        run: |
          pip install pylint
          pylint core routes workers --disable=all --enable=C,R,W,E,F 2>&1 || true

      - name: Run SQLMap for SQL injection testing
        continue-on-error: true
        run: |
          pip install sqlmap
          echo "SQL Injection testing would run against running instance"

  container-scan:
    name: Container Image Scanning
    runs-on: ubuntu-latest
    needs: dast
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend-api
          push: false
          load: true
          tags: diomika:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'diomika:scan'
          format: 'sarif'
          output: 'trivy-image-results.sarif'

      - name: Scan image with Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype diomika:scan --output json > grype-results.json || true
          cat grype-results.json

      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-image'

  report:
    name: Security Report
    runs-on: ubuntu-latest
    if: always()
    needs: [sca, dependency-check, dast, secrets-scan, sast, container-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Comment on PR with security summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '## 🔒 Security Scan Results\n\n';

            summary += `- ✅ SCA: ${{ needs.sca.result }}\n`;
            summary += `- ✅ Dependency Check: ${{ needs.dependency-check.result }}\n`;
            summary += `- ✅ DAST: ${{ needs.dast.result }}\n`;
            summary += `- ✅ Secrets Scan: ${{ needs.secrets-scan.result }}\n`;
            summary += `- ✅ SAST: ${{ needs.sast.result }}\n`;
            summary += `- ✅ Container Scan: ${{ needs.container-scan.result }}\n`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Fail if any critical vulnerabilities found
        run: |
          echo "Security scan completed. Review results in GitHub Security tab."
          exit 0
